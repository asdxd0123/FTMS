<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FTMS - Fleet & Transportation Management</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1d2733;--mut:#667085;--pri:#1f5fbf;--bad:#c0392b;--ok:#1e8e5a;--line:#e3e8ee}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b222b;--ink:#e6ebf1;--mut:#97a3b3;--pri:#5b9bff;--line:#2b3542}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line)}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px}nav button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:6px 12px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}main{padding:0 18px 30px;max-width:1100px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin:10px 0;overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.k{font-size:26px;font-weight:600}.mut{color:var(--mut);font-size:13px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:500}
input,select{padding:7px;margin:3px 6px 3px 0;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
button.p{background:var(--pri);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer}button.s{padding:3px 8px;cursor:pointer}
#msg{padding:8px 14px;margin:10px 18px;border-radius:6px;display:none}.err{background:#fde8e6;color:var(--bad)}.good{background:#e3f6ec;color:var(--ok)}
#login{max-width:340px;margin:12vh auto}.warn{color:var(--bad)}.tag{padding:1px 8px;border-radius:10px;background:var(--line);font-size:12px}
</style></head><body>
<header><b>🚚 FTMS</b><span id="who"></span></header>
<div id="msg"></div>
<div id="login" class="card"><h3>Sign in</h3>
 <input id="u" placeholder="Username" autocomplete="username" style="width:100%"><br>
 <input id="p" type="password" placeholder="Password" autocomplete="current-password" style="width:100%"><br><br>
 <button class="p" id="go">Sign in</button></div>
<nav id="nav" hidden></nav><main id="main" hidden></main>
<script src="/app.js"></script></body></html>
